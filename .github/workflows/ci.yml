name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres + pgvector for the integration-tagged tests (pgstore.go,
    # KeywordSearchSQL), which nothing else exercises.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ayd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ayd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "Not gofmt-formatted:"; echo "$out"; exit 1; fi

      - name: vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: build
        run: go build ./...

      - name: test
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/ayd?sslmode=disable
        run: go test ./... -tags integration -race -coverprofile=coverage.out -covermode=atomic

      - uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
